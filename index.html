  <!-- Prevent a flash of the wrong theme: set data-theme before first paint.
       First visit follows prefers-color-scheme; saved choices win forever. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("kug-cbe-theme")
        var theme = stored === "light" || stored === "dark"
          ? stored
          : window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark"
        document.documentElement.setAttribute("data-theme", theme)
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark")
      }
    })()
  </script>
  <!-- Fonts are self-hosted latin subsets (variable woff2, font-display:swap)
       imported from src/assets/fonts/fonts.css — no render-blocking third-party
       stylesheet, no FOIT. -->
